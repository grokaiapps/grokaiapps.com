  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem("grokaiapps-theme"); } catch (e) {}
      if (t !== "dark" && t !== "light") {
        t = (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-theme", t);
      document.documentElement.classList.add("js");
      if (t === "dark") document.getElementById("theme-color").setAttribute("content", "#121212");
    })();

  <style>
    :root {
      --bg: #f3f3f1; --surface: #fafaf9; --raised: #e9e9e6; --line: #dcdcd7; --line-2: #c4c4be;
      --fg: #141414; --fg-2: #353533; --muted: #666662; --faint: #9a9a95;
      --accent: #8a6d43; --glass: rgba(243, 243, 241, 0.84);
      --shadow: 0 1px 1px rgba(0, 0, 0, 0.04), 0 18px 40px -22px rgba(0, 0, 0, 0.3);
      --f-display: "Newsreader", "Iowan Old Style", Palatino, Georgia, serif;
      --f-ui: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --f-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      --ease: cubic-bezier(0.2, 0.7, 0.1, 1);
      color-scheme: light;
    }
    :root[data-theme="dark"] {
      --bg: #121212; --surface: #181818; --raised: #202020; --line: #2a2a2a; --line-2: #3c3c3c;
      --fg: #ededea; --fg-2: #c9c9c5; --muted: #8e8e89; --faint: #5e5e5a;
      --accent: #c6a875; --glass: rgba(18, 18, 18, 0.84);
      --shadow: 0 1px 0 rgba(255, 255, 255, 0.03) inset, 0 22px 50px -24px rgba(0, 0, 0, 0.85);
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body { min-height: 100dvh; background: var(--bg); color: var(--fg); font: 15px/1.5 var(--f-ui); -webkit-font-smoothing: antialiased; }
    a { color: var(--fg); }
    :focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; border-radius: 8px; }
    .bar {
      position: sticky; top: 0; z-index: 5; background: var(--glass);
      -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top, 0px);
    }
    .wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
    .bar .wrap { height: 56px; display: flex; align-items: center; }
    .bar p { margin: 0; }
    .bar a {
      display: inline-flex; align-items: center; gap: 10px; min-height: 44px;
      font: 500 12.5px/1 var(--f-ui); letter-spacing: 0.2em; text-transform: uppercase; color: var(--fg); text-decoration: none;
    }
    .bar svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; color: var(--muted); }
    main { padding-top: clamp(20px, 5vh, 48px); padding-bottom: calc(56px + env(safe-area-inset-bottom, 0px)); }
    h1 { font: 300 clamp(36px, 7vw, 60px)/1.02 var(--f-display); letter-spacing: -0.028em; margin: 0 0 12px; }
    h2 { font: 500 11px/1.2 var(--f-mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin: 40px 0 14px; }
    .muted { color: var(--muted); max-width: 44rem; margin: 0; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; }
    .grid + .muted { margin-top: 14px; font-size: 14px; }
    figure {
      margin: 0; position: relative; cursor: zoom-in; border-radius: 14px; overflow: hidden;
      background: var(--raised); border: 1px solid var(--line);
      transition: border-color 0.3s, box-shadow 0.35s var(--ease), transform 0.35s var(--ease);
    }
    figure img { width: 100%; height: 100%; object-fit: cover; display: block; }
    :root { --sk-base: #e4e4e0; --sk-hi: rgba(255, 255, 255, 0.9); }
    :root[data-theme="dark"] { --sk-base: #232322; --sk-hi: rgba(255, 255, 255, 0.09); }
    .media { position: relative; display: block; overflow: hidden; aspect-ratio: 1; background: var(--sk-base); }
    .media::before {
      content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none;
      background: linear-gradient(100deg, transparent 30%, var(--sk-hi) 50%, transparent 70%) no-repeat;
      background-size: 200% 100%; animation: shimmer 1.3s ease-in-out infinite;
    }
    .media.loaded::before, .media.failed::before { display: none; }
    .js .media img { opacity: 0; transition: opacity 0.6s var(--ease); }
    .js .media.loaded img { opacity: 1; }
    @keyframes shimmer { from { background-position: 150% 0; } to { background-position: -50% 0; } }
    @keyframes skpulse { 0%, 100% { opacity: 0.25; } 50% { opacity: 0.7; } }
    figure:hover { border-color: var(--line-2); box-shadow: var(--shadow); transform: translateY(-2px); }
    figcaption {
      font: 400 11.5px/1.4 var(--f-mono); color: var(--muted);
      padding: 10px 12px 12px; background: var(--surface); border-top: 1px solid var(--line);
    }
    .pick { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
    .pick figcaption::before {
      content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%;
      background: var(--accent); margin-right: 7px; vertical-align: 1px;
    }

    .lb {
      position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: color-mix(in srgb, var(--bg) 94%, transparent);
      -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
      padding: calc(64px + env(safe-area-inset-top, 0px)) 16px calc(72px + env(safe-area-inset-bottom, 0px));
      animation: fade 0.3s ease;
    }
    .lb[hidden] { display: none; }
    @keyframes fade { from { opacity: 0; } }
    .lb img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 12px; box-shadow: var(--shadow); background: var(--sk-base); transition: filter 0.35s var(--ease), opacity 0.35s var(--ease); }
    .lb img.v-low { filter: blur(10px); }
    .v-spin { position: absolute; left: 50%; top: 50%; width: 34px; height: 34px; margin: -17px 0 0 -17px; border-radius: 50%; border: 2px solid color-mix(in srgb, var(--fg) 14%, transparent); border-top-color: var(--accent); opacity: 0; pointer-events: none; transition: opacity 0.2s; animation: vspin 0.9s linear infinite; }
    .lb.v-loading .v-spin { opacity: 1; transition-delay: 0.12s; }
    @keyframes vspin { to { transform: rotate(360deg); } }
    .lb .v-orig { position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); left: 16px; min-height: 44px; display: inline-flex; align-items: center; padding: 0 12px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); color: var(--fg-2); font: 500 11px/1 var(--f-mono); letter-spacing: 0.12em; text-transform: uppercase; text-decoration: none; }
    .lb-cap { position: absolute; left: 0; right: 0; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); text-align: center; font: 400 12.5px/1.4 var(--f-mono); color: var(--muted); padding: 0 70px; }
    .lb button {
      position: absolute; width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center;
      background: var(--surface); border: 1px solid var(--line); color: var(--fg); cursor: pointer;
    }
    .lb button svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .lb .x { top: calc(12px + env(safe-area-inset-top, 0px)); right: 16px; }
    .lb .prev { left: 16px; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); }
    .lb .next { right: 16px; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); }
    @media (max-width: 560px) { .grid { grid-template-columns: 1fr 1fr; gap: 10px; } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; animation: none !important; }
      .media:not(.loaded):not(.failed)::before { background: var(--sk-hi); animation: skpulse 1.6s ease-in-out infinite !important; }
      .v-spin { border-color: var(--accent); }
      .lb img.v-low { filter: none; opacity: 0.55; }
    }
  </style>

  <script>
    (function () {
      var figs = Array.prototype.slice.call(document.querySelectorAll("main figure"));
      var lb = document.getElementById("lb"), img = document.getElementById("lb-img"), cap = document.getElementById("lb-cap");
      var orig = document.getElementById("lb-orig");
      var at = 0, last = null, sx = 0, token = 0, warmed = {};
      // tiles: shimmer until each thumb loads, then fade in
      Array.prototype.forEach.call(document.querySelectorAll(".media"), function (m) {
        var im = m.querySelector("img");
        var ok = function () { m.classList.add("loaded"); };
        var bad = function () { m.classList.add("failed", "loaded"); };
        im.addEventListener("load", ok);
        im.addEventListener("error", bad);
        if (im.complete && im.naturalWidth) ok();
      });
      function large(f) { var t = f.querySelector("img"); return f.getAttribute("data-large") || t.currentSrc || t.src; }
      function warm(url) { if (!url || warmed[url]) return; var x = new Image(); x.decoding = "async"; x.src = url; warmed[url] = x; }
      function fit() {
        if (lb.hidden) return;
        var f = figs[at], w = Number(f.getAttribute("data-lw")) || 1, h = Number(f.getAttribute("data-lh")) || 1;
        var cs = getComputedStyle(lb);
        var aw = lb.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
        var ah = lb.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
        var k = Math.min(aw / w, ah / h, 1.6);
        img.style.width = Math.max(1, Math.floor(w * k)) + "px";
        img.style.height = Math.max(1, Math.floor(h * k)) + "px";
      }
      function show(i) {
        at = (i + figs.length) % figs.length;
        var f = figs[at], t = f.querySelector("img"), url = large(f), my = ++token;
        fit();
        img.src = t.currentSrc || t.src;
        img.classList.add("v-low");
        img.alt = t.alt;
        lb.classList.add("v-loading");
        cap.textContent = f.querySelector("figcaption").textContent;
        var o = f.getAttribute("data-original");
        orig.hidden = !o;
        if (o) orig.href = o;
        var big = warmed[url] || new Image();
        warmed[url] = big;
        var done = function () { if (my !== token) return; img.src = url; img.classList.remove("v-low"); lb.classList.remove("v-loading"); };
        var fail = function () { if (my !== token) return; img.classList.remove("v-low"); lb.classList.remove("v-loading"); };
        if (big.complete && big.naturalWidth && big.src) done();
        else {
          big.addEventListener("load", done, { once: true });
          big.addEventListener("error", fail, { once: true });
          if (!big.src) { big.decoding = "async"; big.src = url; }
        }
        warm(large(figs[(at + 1) % figs.length]));
        warm(large(figs[(at - 1 + figs.length) % figs.length]));
      }
      window.addEventListener("resize", fit);
      function open(i) { last = document.activeElement; lb.hidden = false; show(i); document.getElementById("lb-x").focus(); }
      function close() { lb.hidden = true; if (last && last.focus) last.focus(); }
      figs.forEach(function (f, i) {
        f.tabIndex = 0;
        f.setAttribute("role", "button");
        f.addEventListener("click", function () { open(i); });
        f.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(i); } });
      });
      document.getElementById("lb-x").addEventListener("click", close);
      document.getElementById("lb-prev").addEventListener("click", function () { show(at - 1); });
      document.getElementById("lb-next").addEventListener("click", function () { show(at + 1); });
      lb.addEventListener("click", function (e) { if (e.target === lb) close(); });
      document.addEventListener("keydown", function (e) {
        if (lb.hidden) return;
        if (e.key === "Escape") close();
        else if (e.key === "ArrowRight") show(at + 1);
        else if (e.key === "ArrowLeft") show(at - 1);
      });
      lb.addEventListener("touchstart", function (e) { sx = e.touches[0].clientX; }, { passive: true });
      lb.addEventListener("touchend", function (e) {
        var dx = e.changedTouches[0].clientX - sx;
        if (Math.abs(dx) > 50) show(at + (dx < 0 ? 1 : -1));
      }, { passive: true });
    })();
  </script>
</body>
</html>
